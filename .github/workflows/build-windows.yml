name: Build OCYFROVKA Windows

on:
  push:
    branches:
      - main
      - 'stage/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocyfrovka-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/Ocyfrovka.App/Ocyfrovka.App.csproj
          dotnet restore tests/Ocyfrovka.Core.Tests/Ocyfrovka.Core.Tests.csproj

      - name: Unit tests
        run: dotnet test tests/Ocyfrovka.Core.Tests/Ocyfrovka.Core.Tests.csproj -c Release --no-restore

      - name: Publish portable Windows x64
        shell: pwsh
        run: |
          dotnet publish src/Ocyfrovka.App/Ocyfrovka.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o publish/OCYFROVKA

          @'
          ОЦИФРОВКА Portable x64

          Розпакуйте архів у папку, доступну для запису, та запустіть ОЦИФРОВКА.exe.
          Встановлення .NET або права адміністратора не потрібні.
          '@ | Set-Content publish/OCYFROVKA/README_PORTABLE.txt -Encoding UTF8

          Compress-Archive -Path publish/OCYFROVKA/* -DestinationPath OCYFROVKA_Portable_x64.zip -CompressionLevel Optimal

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: OCYFROVKA_Portable_x64
          path: OCYFROVKA_Portable_x64.zip
          retention-days: 14